# Publishes the package to npm when a release tag is pushed.
#
# Authentication is OIDC trusted publishing, not a token: npm classic tokens
# were permanently revoked on 2025-12-09. For this to work the package must
# have this repository and workflow registered as a trusted publisher at
# https://www.npmjs.com/package/@cincoders/cinnamon/access
#
# For more information see:
# https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages
name: Deploy and publish
run-name: Publish ${{ github.ref_name }} to npm

on:
  push:
    tags:
      - 'version/v*'

env:
  # Major version that owns the npm "latest" dist-tag. Every other major is
  # published as "v<major>-latest" instead, so releasing a fix on one line
  # never moves "latest" onto the other. Change this to 2 when v2 goes GA;
  # v1 then keeps receiving fixes under "v1-latest".
  LATEST_MAJOR: '1'

jobs:
  build-publish-npm:
    runs-on: ubuntu-latest

    # Gates publishing behind a reviewer. Pushing a tag is enough to reach this
    # workflow, so without an environment anyone with write access to the
    # repository could publish to npm, regardless of who owns the package
    # there. The environment name is part of the OIDC claim, so it must match
    # the trusted publisher registered on npm exactly.
    environment: npm-publish

    permissions:
      contents: read
      # Required for OIDC trusted publishing.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Needed by the ancestry check below, which has to see main.
          fetch-depth: 0

      # A tag name says nothing about the commit it points at: anyone able to
      # push can tag an arbitrary commit on any branch with a name matching
      # version/v*. Publishing only what already reached main closes that,
      # without relying on the reviewer noticing.
      - name: Refuse to publish a commit that is not on main
        run: |
          set -euo pipefail

          git fetch --no-tags origin main

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of main. Release tags must be created on a commit that has been merged into main."
            exit 1
          fi

          echo "${GITHUB_SHA} is on main."

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Trusted publishing needs npm >= 11.5.1, and Node 24 ships 11.17.
      # Asserting that rather than installing npm keeps an unpinned package,
      # and its install scripts, out of the one job that holds a publishing
      # token. If a runner image ever ships something older, this fails here
      # with a clear message instead of failing later on authentication.
      - name: Verify npm supports trusted publishing
        run: |
          set -euo pipefail

          required=11.5.1
          current="$(npm --version)"

          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n 1)" != "$required" ]; then
            echo "::error::npm ${current} is older than ${required}, which trusted publishing requires."
            exit 1
          fi

          echo "npm ${current} supports trusted publishing."

      - name: Resolve version and dist-tag from the tag
        id: release
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#version/v}"
          pkg_version="$(node -p "require('./package.json').version")"

          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} expects version ${tag_version}, but package.json says ${pkg_version}."
            exit 1
          fi

          major="${tag_version%%.*}"
          if [ "$major" = "${LATEST_MAJOR}" ]; then
            dist_tag='latest'
          else
            dist_tag="v${major}-latest"
          fi

          echo "version=${tag_version}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${pkg_version} under dist-tag '${dist_tag}'."

      - run: npm ci --ignore-scripts

      - run: npm run build-lib

      - name: Publish
        run: npm publish --provenance --tag '${{ steps.release.outputs.dist_tag }}'
